[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breeding-tracker"
version = "1.0.0"
description = "Reusable plant-breeding tracking library: Discord observation ingestion, markdown/JSON persistence, migrations, and dashboards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joey Douglas" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/joeydouglas/breeding-tracker"

[tool.setuptools]
packages = ["breeding_tracker"]

[tool.setuptools.package-data]
breeding_tracker = ["templates/*.md"]
